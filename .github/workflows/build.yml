name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      # pyautogui (via mouseinfo) opens the X display at import time, so
      # everything that imports the automation classes runs under a virtual X
      # server. pyscreeze takes Linux screenshots with scrot, and only on a
      # session it recognises as X11 (XDG_SESSION_TYPE, set on the smoke step).
      # The agent playtest kit starts its own Xvfb per session and drives it
      # with xdotool and ImageMagick.
      - name: Install Xvfb, scrot, xdotool and ImageMagick
        run: |
          # man-db rebuilds its index after every install, which took minutes
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth scrot xdotool imagemagick

      # The agent playtest kit is standard-library Python: install it with no
      # extras and check that nothing third-party came along, so the kit's
      # tests below prove it runs without the automation dependencies.
      - name: Install playtester (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python - <<'PY'
          import importlib.util, sys
          found = [m for m in ("PIL", "pyautogui", "pynput") if importlib.util.find_spec(m)]
          sys.exit("installed without extras, yet found: %s" % found if found else 0)
          PY
          python - <<'PY'
          import playtester
          try:
              playtester.GameAutomator
          except ImportError as e:
              assert "automation" in str(e), e
              print("ok:", e)
          else:
              raise SystemExit("GameAutomator imported without the automation extra")
          PY

      - name: Compile Python files
        run: |
          python -m py_compile src/playtester/*.py src/playtester/*/*.py examples/*.py ci/*.py tests/*.py
          echo "All Python files compiled successfully"

      # Unit tests, and end-to-end tests that play the bundled demo game in
      # real virtual displays (three sessions at once). No xvfb-run: the
      # harness starts an Xvfb per session.
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Profiles and the demo smoke session
        run: |
          pt profiles
          for p in $(pt profiles | cut -d" " -f1); do pt validate-profile "$p"; done
          PT_ROOT="$RUNNER_TEMP/pt-smoke" pt smoke --profile demo

      # pt ghosts renders with the Strata engine, which the kit does not
      # depend on: the tests above skip the real renders. Here the Strata
      # Python binding (pinned to a commit) fetches the released libstrata,
      # verified by its SHA-256, and the renders run headless on llvmpipe.
      - name: Ghost trails rendered with Strata
        run: |
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1-mesa-dri
          pip install "strata-engine @ git+https://github.com/Preponderous-Software/strata@5b6fcd37186ebc0b1a91ce5b469ea1b330cbdcac#subdirectory=bindings/python"
          export STRATA_LIBRARY="$(python -c 'import strata; print(strata.fetch_release("0.6.0"))')"
          python -m unittest tests.test_ghosts -v 2>&1 | tee ghosts.log
          if grep -q "skipped" ghosts.log; then echo "a Strata render was skipped"; exit 1; fi
          pt ghosts tests/fixtures/ghosts -o "$RUNNER_TEMP/ghosts.png" --gif "$RUNNER_TEMP/ghosts.gif" --frames 8

      - name: Install the automation extra
        run: pip install -e ".[automation]"

      - name: Verify installation
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -c "import playtester; print('Playtester imported successfully')"

      - name: Smoke test (screenshots + automation cycles)
        env:
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s "-screen 0 1280x720x24" python ci/smoke_test.py
